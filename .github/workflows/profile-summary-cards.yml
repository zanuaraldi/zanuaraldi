name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *" # jalan tiap hari jam 00:00 UTC
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Kalau muncul error "Resource not accessible by integration",
          # ganti dengan Personal Access Token yang disimpan di repo secret,
          # misal: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
